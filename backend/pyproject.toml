[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-land-use-backend"
version = "0.1.0"
description = "Air pollution and land-use impact analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "geoalchemy2==0.16.0",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "pyyaml==6.0.2",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "shapely==2.0.6",
  "pyproj==3.7.0",
  "geopandas==1.0.1",
  "rasterio==1.4.3",
  "rasterstats==0.20.0",
  "rioxarray==0.18.1",
  "xarray==2024.11.0",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "scikit-learn==1.6.0",
  "libpysal==4.12.1",
  "esda==2.6.0",
  "rio-tiler==7.2.2",
  "python-dateutil==2.9.0.post0",
  "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]
gee = [
  "earthengine-api==1.4.3",
]
cdse = [
  "sentinelhub==3.11.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

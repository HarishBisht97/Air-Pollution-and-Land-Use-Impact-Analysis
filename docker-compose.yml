services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: air_land_use
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d air_land_use"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+psycopg://gis:gis@db:5432/air_land_use
      CITY_CONFIG_DIR: /config/cities
      DATA_DIR: /data
      RAW_DATA_DIR: /data/raw
      INTERIM_DATA_DIR: /data/interim
      PROCESSED_DATA_DIR: /data/processed
      SAMPLE_DATA_DIR: /data/sample
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      DEFAULT_CITY_SLUG: delhi
      MAX_DATE_RANGE_DAYS: "10000"
    volumes:
      - ./backend:/app
      - ./config:/config
      - ./data:/data
      - ./scripts:/scripts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.workers.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
